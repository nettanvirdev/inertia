[package]
name = "inertia-setup"
version = "0.1.0"
description = "Installer for Inertia"
authors = ["Tanvir Ahamed"]
license = "MIT"
repository = "https://github.com/nettanvirdev/inertia"
publish = false
edition = "2021"

# One binary, no library split: nothing else links against the installer, and
# the `_lib` dance the app needs exists only because it also builds for mobile.
[[bin]]
name = "inertia-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.dev]
debug = 1
codegen-units = 4

# The payload is embedded in this binary, so every byte saved here is a byte
# off the thing people actually download.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
