version: 2
updates:
  # One grouped pull request per ecosystem per week rather than one per
  # package: CI gates each group, and a single reviewable bump beats a dozen.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns:
          - "*"

  # The app workspace and the two setup binaries each keep their own lockfile.
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/installer/src-tauri"
      - "/uninstaller/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
