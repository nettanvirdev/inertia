[package]
name = "inertia-uninstall"
version = "0.1.0"
description = "Uninstaller for Inertia"
authors = ["you"]
edition = "2021"

[[bin]]
name = "inertia-uninstall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.dev]
debug = 1
codegen-units = 4

# This binary ships inside the app's install directory, so its size is part of
# the app's footprint rather than a one-off download.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
